name: Bug report
description: Report behavior that is broken or misleading.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve Design God. Remove private project data before posting logs or state files.
  - type: input
    id: version
    attributes:
      label: Design God version
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the result and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the command, minimal brief, stage, and repeatable steps.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, package manager, and relevant framework.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, private references, licensed assets, and user project data.
          required: true

