<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · Fernhill Library</title>
<style>
:root {
  --bg: #f6f7f4; --panel: #ffffff; --line: #dfe3dc; --ink: #1d2a24; --ink-2: #4c5a53; --accent: #2f6b4f; --accent-wash: #e6f0ea; --danger: #a8322a;
  --r: 8px; --t: 180ms; --ease-out: cubic-bezier(.23, 1, .32, 1);
  font: 16px/1.5 "Source Sans 3", system-ui, sans-serif;
}
body { margin: 0; background: var(--bg); color: var(--ink); }
main { max-width: 640px; margin: 48px auto; padding: 0 20px; }
h1 { font-size: 28px; margin: 0 0 24px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 24px; display: grid; gap: 20px; }
.field label { display: block; font-weight: 600; margin-bottom: 6px; }
.field input { width: 100%; box-sizing: border-box; height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--r); font: inherit; }
.field input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.help { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
.dropdown { position: relative; }
.dropdown .trigger { width: 100%; height: 44px; text-align: left; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); font: inherit; outline: none; }
.dropdown .menu { display: none; position: absolute; top: 48px; left: 0; right: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); margin: 0; padding: 4px; list-style: none; }
.dropdown.open .menu { display: block; }
.dropdown .menu li { padding: 8px 10px; cursor: pointer; }
button.save { height: 44px; padding: 0 20px; border: 0; border-radius: var(--r); background: var(--accent); color: #fff; font: inherit; font-weight: 600; justify-self: start; }
</style>
</head>
<body>
<main>
  <h1>Settings</h1>
  <form class="panel">
    <div class="field"><label for="name">Display name</label><input id="name" value="Dana Ruiz" autocomplete="name"><p class="help">Shown on your holds and reviews.</p></div>
    <div class="field"><label for="email">Email</label><input id="email" type="email" value="dana@example.org" autocomplete="email"></div>
    <div class="field"><label>Language</label>
      <div class="dropdown" id="lang"><div class="trigger" onclick="this.parentNode.classList.toggle('open')">English</div>
        <ul class="menu"><li>English</li><li>Español</li><li>Français</li><li>Қазақша</li></ul></div>
    </div>
    <button class="save" type="submit">Save changes</button>
  </form>
</main>
<script>
document.querySelectorAll('#lang .menu li').forEach(li => li.onclick = () => { document.querySelector('#lang .trigger').textContent = li.textContent; document.getElementById('lang').classList.remove('open'); });
</script>
</body>
</html>
